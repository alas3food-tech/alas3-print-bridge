name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    # Fijo en 24.04: desde oct 2026 ubuntu-latest es Ubuntu 26 y ahi falla "Instalar Android SDK".
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # El Android SDK ya viene instalado en las maquinas de GitHub (ANDROID_HOME). El paso
      # android-actions/setup-android@v3 dejo de funcionar en oct 2026 (Node 20 retirado).

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK (debug, listo para instalar)
        run: gradle assembleDebug --no-daemon

      - name: Subir el APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Alas3Impresora-APK
          path: app/build/outputs/apk/debug/app-debug.apk
